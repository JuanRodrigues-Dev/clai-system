databases:
  - name: clai-db
    databaseName: claidb
    user: claiapp
    plan: free

services:
  # Backend API - Spring Boot 4 / Java 21
  - type: web
    name: clai-backend
    runtime: docker
    dockerContext: apps/clai-backend
    dockerfilePath: apps/clai-backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: clai-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: ADMIN_EMAIL
        value: admin@ifpb.edu.br
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  # Frontend Web - React 19 + TypeScript + Vite (Static Site)
  - type: web
    name: clai-frontend
    runtime: static
    rootDir: apps/clai-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: clai-backend
          property: host
