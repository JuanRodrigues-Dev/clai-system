management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    br.edu.ifpb.clai: DEBUG
    org.springframework.web: INFO

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claidb}
    username: ${SPRING_DATASOURCE_USERNAME:claiapp}
    password: ${SPRING_DATASOURCE_PASSWORD:clai123}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

clai:
  jwt:
    secret: ${JWT_SECRET:default_dev_jwt_secret_key_minimum_256_bits_length_clai}