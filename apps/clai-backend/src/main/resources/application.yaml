server:
  port: ${PORT:8080}

spring:
  application:
    name: clai-api
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:.env.dev[.properties],optional:file:../../.env.dev[.properties],optional:file:.env.prod[.properties],optional:file:../../.env.prod[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claidb}
    username: ${SPRING_DATASOURCE_USERNAME:claiapp}
    password: ${SPRING_DATASOURCE_PASSWORD:clai123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

clai:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:default_dev_jwt_secret_key_minimum_256_bits_length_clai}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
